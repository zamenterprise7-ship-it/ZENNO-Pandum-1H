
name: Extract ZIP and Build ZENNO APK

on:
  push:
    paths:
      - 'ZENNO_Pandum_1H_Complete_Online_Build.zip'
      - '.github/workflows/unzip-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -o ZENNO_Pandum_1H_Complete_Online_Build.zip -d project
          ls -la project
          test -f project/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build ZENNO APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZENNO-Pandum-1H-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
